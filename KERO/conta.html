<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Minha Conta - KERO DIGITAL</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<div class="header-main">

<a href="index.html" class="logo">
KERO<span>.</span>
</a>

</div>

<nav class="navbar">

<a href="index.html">Início</a>
<a href="catalogo.html">Catálogo</a>
<a href="encomendas.html">Encomendas</a>

</nav>

</header>


<section class="page-header">

<div class="container">

<h1>Minha conta</h1>

<p>Aceda à sua área pessoal.</p>

</div>

</section>


<main class="container">

<div class="form">

<h2>Entrar</h2>

<br>

<div class="form-group">

<label>Email ou telefone</label>

<input type="text"
placeholder="Digite o seu email ou telefone">

</div>


<div class="form-group">

<label>Senha</label>

<input type="password"
placeholder="Digite a sua senha">

</div>


<button class="btn"
onclick="alert('Login demonstrativo.')">
Entrar
</button>

<hr>

<br>

<h2>Criar conta</h2>

<br>

<div class="form-group">

<label>Nome completo</label>

<input type="text"
placeholder="Nome completo">

</div>


<div class="form-group">

<label>Email</label>

<input type="email"
placeholder="Email">

</div>


<div class="form-group">

<label>Telefone</label>

<input type="tel"
placeholder="Telefone">

</div>


<div class="form-group">

<label>Senha</label>

<input type="password"
placeholder="Criar senha">

</div>


<button class="btn">
Criar conta
</button>

</div>

</main>

</body>
</html>
