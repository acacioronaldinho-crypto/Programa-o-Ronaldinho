<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrinho - KERO DIGITAL</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<div class="header-main">

<a href="index.html" class="logo">
KERO<span>.</span>
</a>

<div class="header-actions">

<a href="catalogo.html" class="action">
🛍️<br>Continuar a comprar
</a>

<a href="conta.html" class="action">
👤<br>Conta
</a>

</div>

</div>

<nav class="navbar">

<a href="index.html">Início</a>
<a href="catalogo.html">Catálogo</a>
<a href="promocoes.html">Promoções</a>
<a href="encomendas.html">Encomendas</a>

</nav>

</header>


<section class="page-header">

<div class="container">

<h1>Meu Carrinho</h1>

<p>Revise os produtos antes de finalizar.</p>

</div>

</section>


<main class="container">

<div id="cartContent"></div>

</main>


<script src="js/app.js"></script>

<script>

function renderCart() {

const container =
document.getElementById("cartContent");

if (cart.length === 0) {

container.innerHTML = `
<div class="info-card">

<h2>O seu carrinho está vazio.</h2>

<br>

<a href="catalogo.html"
class="btn">
Explorar produtos
</a>

</div>
`;

return;
}

let total = 0;

let html = `
<table class="cart-table">

<tr>
<th>Produto</th>
<th>Preço</th>
<th>Quantidade</th>
<th>Subtotal</th>
<th>Ação</th>
</tr>
`;

cart.forEach((item,index) => {

const subtotal =
item.price * item.quantity;

total += subtotal;

html += `

<tr>

<td>${item.name}</td>

<td>${item.price.toLocaleString()} Kz</td>

<td>

<button onclick="changeQuantity(${index},-1)">
-
</button>

${item.quantity}

<button onclick="changeQuantity(${index},1)">
+
</button>

</td>

<td>
${subtotal.toLocaleString()} Kz
</td>

<td>

<button
class="btn btn-red"
onclick="removeFromCart(${index})">
Remover
</button>

</td>

</tr>
`;

});

html += `
</table>

<div class="cart-summary">

<div>
<span>Subtotal</span>
<strong>${total.toLocaleString()} Kz</strong>
</div>

<div>
<span>Entrega</span>
<strong>A calcular</strong>
</div>

<hr><br>

<div class="total">
<span>Total</span>
<span>${total.toLocaleString()} Kz</span>
</div>

<button
class="btn"
onclick="finalizarCompra()">
Finalizar encomenda
</button>

</div>
`;

container.innerHTML = html;

}

renderCart();

</script>

</body>
</html>
