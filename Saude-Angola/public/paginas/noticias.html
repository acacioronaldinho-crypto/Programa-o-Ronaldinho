<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Notícias | SaúdeAngola</title>

<link rel="stylesheet"
href="../css/style.css">

</head>

<body>

<header class="navbar">

<div class="logo">
<span>+</span> SaúdeAngola
</div>

<nav>

<a href="../index.html">
Início
</a>

<a href="noticias.html">
Notícias
</a>

<a href="doencas.html">
Doenças
</a>

</nav>

</header>

<section class="page-header">

<span class="badge">
ATUALIZAÇÕES
</span>

<h1>
Notícias de Saúde
</h1>

<p>
Informações e novidades da plataforma.
</p>

</section>

<section class="page-content">

<div id="noticias"
class="cards">

</div>

</section>

<script>

async function carregarNoticias() {

const resposta =
await fetch("../api/noticias");

const noticias =
await resposta.json();

const container =
document.getElementById("noticias");

container.innerHTML = "";

noticias.forEach(noticia => {

container.innerHTML += `

<div class="card">

<div class="card-icon">
📰
</div>

<h3>
${noticia.titulo}
</h3>

<p>
${noticia.resumo}
</p>

<small>
${noticia.data}
</small>

</div>

`;

});

}

carregarNoticias();

</script>

<script src="../js/app.js"></script>

</body>

</html>
