<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Contacto | SaúdeAngola</title>

<link rel="stylesheet"
      href="../css/style.css">

</head>

<body>

<header class="navbar">

<div class="logo">
<span>+</span> SaúdeAngola
</div>

<nav>

<a href="../index.html">
Início
</a>

<a href="sobre.html">
Sobre
</a>

<a href="contacto.html">
Contacto
</a>

</nav>

</header>

<section class="page-header">

<h1>
Contacto
</h1>

<p>
Envie uma mensagem para a equipa da plataforma.
</p>

</section>

<section class="page-content">

<div class="form-container">

<form id="contactForm">

<label>
Nome
</label>

<input
type="text"
name="nome"
required
>

<label>
Email
</label>

<input
type="email"
name="email"
required
>

<label>
Mensagem
</label>

<textarea
name="mensagem"
required
></textarea>

<button
class="btn btn-primary"
type="submit"
>

Enviar mensagem

</button>

</form>

<div id="resultado"></div>

</div>

</section>

<script>

document
.getElementById("contactForm")
.addEventListener("submit", async function(event) {

event.preventDefault();

const dados =
Object.fromEntries(
new FormData(this)
);

const resposta =
await fetch("../api/contacto", {

method: "POST",

headers: {
"Content-Type":
"application/json"
},

body:
JSON.stringify(dados)

});

const resultado =
await resposta.json();

document
.getElementById("resultado")
.innerHTML =
`<p>${resultado.mensagem}</p>`;

this.reset();

});

</script>

<script src="../js/app.js"></script>

</body>

</html>
