<!DOCTYPE html>
<html lang="PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM DO JS</title>
</head>
<body>
    <h1>ESTUDO DO DOM</h1>
    <p>Como é a ligaçao</p>
    <p>Clique aqui</p>
    
    <script>
        var j=window.document.body
        j.style.backgroundColor='blue'
    var z=window.document.getElementsByTagName('p')[0]
    window.document.write(z.innerText)
    z.style.color='blue'
    z.style.backgroundColor='red'
    z.style.borderRadius='20px'
    z.style.width='50%'
    
    
    
    

    </script>
    
</body>
</html>
