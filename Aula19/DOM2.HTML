<!DOCTYPE html>
<html lang="PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIV E DOM</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            background-color: green;
            text-align: center;


        }

    </style>
</head>
<body>
    <div id="b1" onclick="clicar()" onmouseenter="dentro"()onmouseout="fora"()>
    <p>Veja o que aconteça</p>
    </div>
    <script>
        var a=window.document.getElementById('b1')
        function clicar(){
            a.innerText='Foi clicado'
            a.style.background='blue'

        }
        function dentro(){
            a.innerText='mouse dentro'
            a.style.background='red'
        }
        function fora(){
            a.innerText='mouse fora'
            a.style.background='yellow'
        }

    </script>
    
    
</body>
</html>
